# Produção em uma máquina só: MySQL + API + site (nginx).
#   cp deploy/.env.production.example deploy/.env.production   (e preencher)
#   docker compose -f docker-compose.prod.yml --env-file deploy/.env.production up -d --build
# Coloque um proxy HTTPS (Caddy, Cloudflare...) na frente da porta 8080.
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: totalcontrol
      MYSQL_USER: totalcontrol
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - dados-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build: ./server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      TRUST_PROXY: 1
      DATABASE_URL: mysql://totalcontrol:${MYSQL_PASSWORD}@db:3306/totalcontrol
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_SENHA: ${ADMIN_SENHA}
      APP_URL: ${APP_URL}
      API_PUBLIC_URL: ${APP_URL}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN:-}
      MERCADOPAGO_WEBHOOK_SECRET: ${MERCADOPAGO_WEBHOOK_SECRET:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      SENTRY_DSN: ${SENTRY_DSN:-}

  web:
    build:
      context: .
      args:
        VITE_SITE_URL: ${APP_URL}
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  dados-mysql:

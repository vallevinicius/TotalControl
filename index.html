<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/total-controle-icone-transparente.png" />
    <link rel="apple-touch-icon" href="/total-controle-icone-app-fundo-escuro.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#10B981" />
    <!-- Aplica o tema antes do React carregar (padrão: claro), pra não piscar no tema errado. -->
    <script>
      try {
        document.documentElement.setAttribute(
          "data-theme",
          localStorage.getItem("total_control_tema_v2") === "dark" ? "dark" : "light"
        );
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "light");
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="%VITE_SITE_URL%/" />

    <meta
      name="description"
      content="Total Control: sistema de PDV, estoque e financeiro para o pequeno varejo. Venda no caixa, controle o estoque e acompanhe o financeiro da sua loja em um só lugar."
    />
    <title>Total Control | PDV, Estoque e Financeiro pra sua loja</title>

    <!-- Open Graph (WhatsApp, Facebook, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:site_name" content="Total Control" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="Total Control | PDV, Estoque e Financeiro pra sua loja" />
    <meta
      property="og:description"
      content="O sistema de ponto de venda feito pro pequeno varejo brasileiro: venda no PDV, controle o estoque e acompanhe o financeiro da sua loja em um só lugar."
    />
    <meta property="og:image" content="%VITE_SITE_URL%/total-controle-logo-horizontal-fundo-escuro.png" />

    <!-- Twitter/X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Total Control | PDV, Estoque e Financeiro pra sua loja" />
    <meta
      name="twitter:description"
      content="O sistema de ponto de venda feito pro pequeno varejo brasileiro: venda no PDV, controle o estoque e acompanhe o financeiro da sua loja em um só lugar."
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%/total-controle-logo-horizontal-fundo-escuro.png" />

    <!-- Dados estruturados: ajudam o Google a entender que a página descreve um software. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Total Control",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "inLanguage": "pt-BR",
        "url": "%VITE_SITE_URL%/",
        "description": "Sistema de PDV, estoque e financeiro para o pequeno varejo.",
        "publisher": { "@type": "Organization", "name": "Total Software" },
        "offers": [
          { "@type": "Offer", "name": "Starter", "price": "59.90", "priceCurrency": "BRL" },
          { "@type": "Offer", "name": "Pro", "price": "129.90", "priceCurrency": "BRL" },
          { "@type": "Offer", "name": "Enterprise", "price": "249.90", "priceCurrency": "BRL" }
        ]
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-ink-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

# Site e API no mesmo endereço: o navegador chama /api no próprio domínio (sem CORS).
# O HTTPS termina antes daqui (Caddy, Cloudflare, balanceador do provedor...).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /api/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    client_max_body_size 5m;
  }

  # Arquivos com hash no nome: cache longo.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # O service worker e o index nunca ficam em cache, para as versões novas chegarem.
  location = /sw.js { add_header Cache-Control "no-cache"; }
  location = /index.html { add_header Cache-Control "no-cache"; }

  # Rotas do app (/login, /admin...): sempre devolvem o index.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
